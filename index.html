<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPlacePay — Nova jornada</title>
<style>
  *{box-sizing:border-box;margin:0;}
  html,body{height:100%;}
  body{
    font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Roboto","Arial",sans-serif;
    background:#F5F5F7;color:#1D1D1F;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;text-align:center;-webkit-font-smoothing:antialiased;
  }
  .card{background:#fff;border-radius:24px;padding:48px 40px;max-width:460px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.08);}
  .logo{width:72px;height:72px;border-radius:50%;border:3px solid #C8D400;
    display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
    font-size:15px;font-weight:800;}
  h1{font-size:26px;font-weight:700;letter-spacing:-.4px;margin-bottom:10px;}
  p{font-size:15px;line-height:1.6;color:#6E6E73;margin-bottom:6px;}
  .tag{display:inline-block;margin-top:22px;background:#C8D400;color:#1D1D1F;
    font-size:13px;font-weight:700;padding:8px 18px;border-radius:100px;}
  .foot{margin-top:28px;font-size:12px;color:#B0B0B6;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">iPlace</div>
    <h1>iPlacePay — Nova jornada</h1>
    <p>Este é o ambiente onde a nova jornada de compra será publicada.</p>
    <p>Em construção.</p>
    <span class="tag">Está no ar! 🎉</span>
    <div class="foot">Página de teste · GitHub Pages</div>
  </div>
</body>
</html>
